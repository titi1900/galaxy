<!doctype html>
<!--
=====================================================================
  GALAXIE : shoot’em up façon Galaxian (fichier unique HTML + CSS + JS)
=====================================================================
  STRUCTURE DU FICHIER
    1. <style>  : mise en page plein écran (canvas 3:4 centré)
    2. <body>   : un <canvas> unique : le jeu ET ses menus (boutons dessinés dans le canvas)
    3. <script> : tout le jeu, dans une IIFE (aucune variable globale)

  ARCHITECTURE DU JEU
    - Boucle : loop() → upd(dt) (logique) puis draw() (rendu), à chaque image.
    - dt = temps écoulé en secondes (plafonné à 0,05 s). Toute vitesse est
      exprimée en pixels par seconde et multipliée par dt.
    - Repère logique du canvas : 480 × 640 px (CSS le met à l’échelle).

  MACHINE À ÉTATS (variable `st`)
    title → play → warn → boss → next → play (vague suivante) …
                                      ↘ over (vies = 0, depuis n’importe quel état de jeu)
      title : écran d’accueil
      play  : vague d’aliens en cours
      warn  : alerte de 2,4 s avant le boss (tous les aliens sont morts)
      boss  : combat contre le boss
      next  : boss vaincu, message de 2,4 s puis vague suivante (niveau + 1)
      over  : partie terminée (boutons Rejouer / Menu)

  ENTITÉS (tableaux ou objets simples, pas de classes)
    al   aliens        {r rangée, sx/sy case dans la formation, x/y position, s état}
                       état s : 'f' en formation | 'd' en plongeon | 'r' retour/entrée
    pl   joueur        {x, y, inv (invincibilité en s), cd (délai avant prochain tir)}
    pb   tirs joueur   {x, y, vx, vy}
    eb   tirs ennemis  {x, y, vx, vy, r (rayon, défaut 4)}
    gf   bonus tombants{x, y, k type : P puissance | D drone | B bouclier | + points}
    pt   particules    {x, y, vx, vy, l durée de vie restante, c couleur}
    boss objet ou null {x, y, hp/mhp vie, sh/msh bouclier, cd, n, fl, t}

  SMARTPHONE, TABLETTE, ORDINATEUR : UN SEUL CODE
    - Affichage : le canvas garde son ratio 3:4 et occupe le maximum de l’écran
      (largeur ET hauteur prises en compte, marges d’encoche respectées avec env(safe-area-*)).
      Il s’adapte tout seul à la rotation ; en paysage sur tablette il est centré avec des bandes sombres.
    - Entrées : « Pointer Events » (un seul code pour doigt, stylet et souris).
        · glisser le doigt (ou la souris) n’importe où = déplacement latéral du vaisseau
        · déplacement RELATIF : le vaisseau bouge de la même distance que le doigt, sans se
          placer dessous (on le voit toujours) ; réglable avec DRAG_SENS
        · multi-touch : seul le premier doigt pilote ; un second doigt peut appuyer sur les boutons
        · clavier conservé pour les tests : flèches ou Q/D, P ou Échap = pause
    - Tir : automatique, rien à toucher.
    - Menus : dessinés dans le canvas (Jouer, Pause, Rejouer…). Le jeu ne démarre jamais seul
      et se met en pause (jamais de sortie) si l’appli passe en arrière-plan.

  COMMENT MODIFIER L’ÉQUILIBRAGE (cherchez ces repères dans le script)
    Vitesse du vaisseau (clavier) « dir*270 »   dans upd()
    Sensibilité du glissement .. DRAG_SENS (section 1, début du script)
    Cadence de tir ............. « .27-pw*.035 » (plancher .085) dans upd()
    Puissance max .............. « Math.min(5,pw+1) » dans take()
    Drones max ................. « Math.min(2,dr+1) » dans take()
    Chance de bonus par alien .. « drop(a.x,a.y,.16) » dans upd()
    Vie / bouclier du boss ..... « hp=120+level*60, sh=80+level*30 » dans upd()
    Cadence / vitesse boss ..... bossFire()
    Aliens simultanés en plongeon « Math.min(2+(level>>1),6) » dans upd()
    Fréquence des plongeons .... « 1.7-level*.12 » dans upd()
    Formation (lignes) ......... tableau CNT (aliens par rangée)
=====================================================================
-->
<html lang="fr">
<head>
<!-- Favicons (chemins relatifs racine) -->
<link rel="icon" type="image/svg+xml" href="./favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta charset="utf-8">
<!-- viewport-fit=cover : le jeu occupe tout l’écran sur mobile ; les marges système sont gérées par env(safe-area-*) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Favicon intégré (emoji) : aucun fichier image à héberger. Pour une image à vous : <link rel="icon" href="favicon.png"> -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👾</text></svg>">
<title>Galaxie</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Plein écran, fond identique au jeu ; le canvas garde son ratio 3:4 (bandes sombres si l’écran est plus allongé) */
html,body{height:100%;margin:0;background:#070b1f;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#c{width:min(100%,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * .75));height:auto;aspect-ratio:3/4;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c" aria-label="Jeu Galaxie : déplacez le vaisseau et tirez sur les envahisseurs"></canvas>


<script>
(()=>{
/* ================================================================
   1. CONSTANTES ET ÉTAT GLOBAL DU JEU
   ================================================================ */
const W=480,H=640;                       // taille logique du canvas (le CSS le met à l’échelle de l’écran)
const DRAG_SENS=1.4;                     // sensibilité du glissement : 1 = le vaisseau suit exactement le doigt, >1 = plus nerveux
const cv=document.getElementById('c'),g=cv.getContext('2d');
cv.width=W;cv.height=H;

/* Sprites pixel-art : tableaux de chaînes, '1' = pixel plein, '0' = vide.
   spr() les dessine à l’échelle voulue, centrés sur (cx, cy). */
const body=["00100000100","00010001000","00111111100","01101110110","11111111111","10111111101"];  // corps d’alien (haut)
const L1=["10100000101","00011011000"], L2=["00100000100","01000000010"];                            // 2 poses des pattes (animation)
const SHIP=["00000100000","00001110000","00001110000","01101110110","01111111110","11111111111","11101110111","11000100011"];
const BOSS=["001000000000100","001100111001100","011111111111110","111011111110111","111111111111111","110111111111011","110011101110011","010001000100010","010000000000010"];

/* Formation d’aliens : une entrée par rangée (de haut en bas) */
const COL=['#ff6b57','#ffb02e','#b388ff','#3ddbd9','#3ddbd9'];  // couleur de chaque rangée
const PTS=[60,50,40,30,30];                                      // points par rangée (x2 si l’alien est en plongeon)
const CNT=[4,6,8,10,10];                                         // nombre d’aliens par rangée (centrés sur 10 colonnes)

/* Couleurs des bonus tombants (la lettre affichée = la clé) */
const GC={P:'#ffb02e',D:'#3ddbd9',B:'#b388ff','+':'#8bf06b'};

const rnd=(a,b)=>a+Math.random()*(b-a);   // nombre aléatoire dans [a, b[

/* État de la partie (réinitialisé par reset()) */
let st='title';        // état courant (voir machine à états en tête de fichier)
let score=0, best=0;   // score et meilleur score (best est sauvegardé en localStorage)
let lives=3, level=1;  // vies restantes, numéro de vague/niveau
let time=0;            // temps total écoulé (sert aux animations et au balancement de la formation)
let al=[], pb=[], eb=[], pt=[], gf=[];  // aliens, tirs joueur, tirs ennemis, particules, bonus
let pl={x:W/2,y:H-70,inv:0,cd:0};       // joueur
let pw=1;              // puissance de tir (1 à 5)
let dr=0;              // nombre de drones latéraux (0 à 2)
let boss=null;         // le boss, ou null
let diveT=0;           // compte à rebours avant le prochain plongeon d’alien
let msgT=0;            // compte à rebours des états 'warn' et 'next'
let overAt=0;          // instant de la défaite (empêche de relancer par erreur en martelant Espace)
let K={};              // touches clavier enfoncées (test sur ordinateur)
let paused=false;      // true = jeu en pause (menu Pause affiché)
let btns=[];           // boutons du menu actuellement affichés : {x,y,w,h,fn}, recalculés à chaque draw()

try{best=+localStorage.getItem('galaxie-best')||0}catch(e){}   // localStorage peut être indisponible : on ignore

/* Étoiles du fond : s = taille ET vitesse de défilement (effet de profondeur) */
const stars=Array.from({length:70},()=>({x:rnd(0,W),y:rnd(0,H),s:rnd(.3,1.4)}));

/* ================================================================
   2. OUTILS GÉNÉRIQUES
   ================================================================ */
/* Dessine un sprite pixel-art. rows = tableau de chaînes, px = taille d’un pixel, col = couleur */
function spr(rows,cx,cy,px,col){
  g.fillStyle=col;
  const w=rows[0].length,h=rows.length,x0=cx-w*px/2,y0=cy-h*px/2;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++)
    if(rows[j][i]==='1')g.fillRect(Math.round(x0+i*px),Math.round(y0+j*px),Math.ceil(px),Math.ceil(px));
}

/* Explosion : crée n particules de couleur c qui partent dans toutes les directions */
function boom(x,y,c,n){
  for(let i=0;i<n;i++){
    const a=rnd(0,6.28),v=rnd(40,200);
    pt.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.3,.7),c});
  }
}

/* ================================================================
   3. VAGUES, DÉBUT ET FIN DE PARTIE
   ================================================================ */
/* Crée une nouvelle formation. Les aliens commencent hors écran (état 'r')
   et viennent se placer dans leur case : c’est l’animation d’entrée. */
function wave(){
  al=[];
  CNT.forEach((c,r)=>{
    for(let i=0;i<c;i++){
      const col=(10-c)/2+i, sx=42+col*44;     // colonne centrée → position x de la case
      al.push({r, sx, sy:96+r*34, x:sx, y:-40-r*30, s:'r', t:0, shots:0});
    }
  });
  eb=[];diveT=2;
}

/* Nouvelle partie : remet tout à zéro et lance la vague 1 */
function reset(){
  score=0;lives=3;level=1;
  pl={x:W/2,y:H-70,inv:1.5,cd:0};
  pb=[];pt=[];gf=[];pw=1;dr=0;boss=null;
  wave();st='play';
}

/* Défaite : mémorise le meilleur score */
function endGame(){
  st='over';overAt=performance.now();
  if(score>best){best=score;try{localStorage.setItem('galaxie-best',best)}catch(e){}}
}

/* ================================================================
   4. JOUEUR : TIR, BONUS
   ================================================================ */
/* Une salve, appelée automatiquement par upd(). Le motif dépend de la puissance pw :
   1 = simple | 2 = double | 3 = triple en éventail | 4 = quadruple | 5 = quintuple large.
   Les vx non nuls donnent l’angle d’éventail. Chaque drone ajoute 1 tir droit. */
function shoot(){
  const y=pl.y-18, v=560+pw*20, add=(x,vx)=>pb.push({x,y,vx,vy:-v});
  if(pw===1)add(pl.x,0);
  else if(pw===2){add(pl.x-7,0);add(pl.x+7,0)}
  else if(pw===3){add(pl.x,0);add(pl.x-10,-70);add(pl.x+10,70)}
  else if(pw===4){add(pl.x-7,0);add(pl.x+7,0);add(pl.x-14,-110);add(pl.x+14,110)}
  else{add(pl.x,0);add(pl.x-8,-60);add(pl.x+8,60);add(pl.x-16,-150);add(pl.x+16,150)}
  for(let i=0;i<dr;i++)pb.push({x:pl.x+(i?34:-34),y:pl.y-4,vx:0,vy:-v});   // drones : à gauche (i=0) et à droite (i=1)
}

/* Effet d’un bonus ramassé (k = lettre du bonus) */
function take(k){
  if(k==='P'){pw=Math.min(5,pw+1);score+=100}           // P : puissance +1 (max 5)
  else if(k==='D'){dr=Math.min(2,dr+1);score+=100}      // D : drone +1 (max 2)
  else if(k==='B')pl.inv=Math.max(pl.inv,5);            // B : bouclier = 5 s d’invincibilité
  else{score+=500;eb=[]}                                // + : 500 points et efface les tirs ennemis
}

/* Fait tomber un bonus à (x, y) avec la probabilité p. Répartition : P 40 %, D 25 %, B 20 %, + 15 % */
function drop(x,y,p){
  if(Math.random()<p){
    const r=Math.random();
    gf.push({x,y,k:r<.4?'P':r<.65?'D':r<.85?'B':'+'});
  }
}

/* ================================================================
   5. BOSS
   ================================================================ */
/* Un tir du boss. Deux motifs en alternance :
   - impairs : éventail visé sur le joueur (plus large à chaque phase)
   - pairs   : rideau de balles vers le bas
   La phase (1 à 3) dépend de la vie restante (< 66 % puis < 33 %) ;
   en phase 3 s’ajoute une grosse balle rapide visée. */
function bossFire(){
  const B=boss, ph=B.hp<B.mhp*.33?3:B.hp<B.mhp*.66?2:1, sp=200+level*8;
  const push=(a,s,r)=>eb.push({x:B.x,y:B.y+30,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r});  // a = angle, s = vitesse, r = rayon
  const aim=Math.atan2(pl.y-B.y,pl.x-B.x);
  B.n++;
  if(B.n%2){for(let i=-ph-1;i<=ph+1;i++)push(aim+i*.2,sp,5)}
  else{const n=8+ph*3;for(let i=0;i<n;i++)push(Math.PI*(.1+.8*i/(n-1)),sp*.8,6)}
  if(ph===3)push(aim,sp*1.5,7);
  B.cd=Math.max(.5,1.15-ph*.15-level*.03);   // délai avant le prochain tir : plus court avec la phase et le niveau
}

/* Mise à jour du boss : déplacement, tirs, dégâts reçus, mort.
   Les coups touchent d’abord le BOUCLIER (sh), puis la VIE (hp). */
function bossStep(dt){
  const B=boss;B.t+=dt;B.fl-=dt;                                      // fl = durée restante du flash blanc
  B.x=W/2+Math.sin(B.t*.8)*130*Math.min(1,B.t/2.5);                   // va-et-vient horizontal, amplitude croissante à l’arrivée
  if(B.y<110)B.y+=80*dt;                                              // descente jusqu’à y=110
  else{B.cd-=dt;if(B.cd<=0)bossFire()}                                // il ne tire qu’une fois en position
  for(const b of pb){
    if(Math.abs(b.x-B.x)<54&&Math.abs(b.y-B.y)<32){                   // zone de touche du boss
      b.y=-99;B.fl=.08;                                               // le tir est consommé (supprimé au prochain filtre)
      if(B.sh>0){
        B.sh--;
        if(B.sh<=0){boom(B.x,B.y,'#3ddbd9',30);drop(B.x-30,B.y,1);drop(B.x+30,B.y,1)}   // bouclier brisé : 2 bonus garantis
      }else{B.hp--;score+=10}
    }
  }
  if(B.hp<=0){                                                        // mort du boss
    boom(B.x,B.y,'#ff4d6d',60);boom(B.x,B.y,'#ffb02e',40);
    score+=2000*level;drop(B.x-40,B.y,1);drop(B.x,B.y,1);drop(B.x+40,B.y,1);   // 3 bonus garantis
    boss=null;eb=[];st='next';msgT=2.4;
  }
}

/* Rendu du boss : sprite, œil, bulle de bouclier, barres de vie (rouge) et de bouclier (cyan) */
function drawBoss(){
  const B=boss;
  spr(BOSS,B.x,B.y,7,B.fl>0?'#ffffff':'#ff4d6d');                     // blanc pendant le flash de dégât
  g.fillStyle='#ffd23f';g.fillRect(B.x-10,B.y-4,20,12);               // œil central
  if(B.sh>0){g.strokeStyle='rgba(61,219,217,'+(.3+.5*B.sh/B.msh)+')';g.lineWidth=3;g.beginPath();g.ellipse(B.x,B.y,72,48,0,0,6.3);g.stroke()}
  g.fillStyle='#1b2250';g.fillRect(90,40,300,10);                     // fond de barre
  g.fillStyle='#ff4d6d';g.fillRect(90,40,300*Math.max(0,B.hp)/B.mhp,10);
  g.fillStyle='#3ddbd9';g.fillRect(90,52,300*Math.max(0,B.sh)/B.msh,4);
}

/* ================================================================
   6. MISE À JOUR DE LA LOGIQUE (appelée à chaque image)
   ================================================================ */
function upd(dt){
  time+=dt;

  /* --- Décor : toujours animé, même sur les écrans titre et fin --- */
  stars.forEach(s=>{s.y+=s.s*40*dt;if(s.y>H){s.y=0;s.x=rnd(0,W)}});
  pt.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});pt=pt.filter(p=>p.l>0);
  if(st==='title'||st==='over')return;       // le reste ne tourne qu’en jeu

  const ox=Math.sin(time*.7)*30;             // décalage horizontal commun de la formation (balancement)

  /* --- Joueur : déplacement (flèches / Q-D / A / boutons tactiles), tir automatique --- */
  pl.cd-=dt;pl.inv-=dt;
  const dir=((K.arrowright||K.d||K.r)?1:0)-((K.arrowleft||K.q||K.a||K.l)?1:0);   // -1, 0 ou +1
  pl.x=Math.max(20,Math.min(W-20,pl.x+dir*270*dt));
  if(pl.cd<=0){shoot();pl.cd=Math.max(.085,.27-pw*.035)}                          // plus de puissance = tir plus rapide

  /* --- Projectiles et bonus : déplacement puis nettoyage hors écran --- */
  pb.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});pb=pb.filter(b=>b.y>-10&&b.x>-10&&b.x<W+10);
  gf.forEach(o=>{o.y+=95*dt;if(Math.abs(o.x-pl.x)<22&&Math.abs(o.y-pl.y)<24){o.d=1;take(o.k)}});   // ramassage au contact
  gf=gf.filter(o=>!o.d&&o.y<H+20);
  eb.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});eb=eb.filter(b=>b.y<H+10&&b.x>-10&&b.x<W+10);

  /* --- Plongeons : de temps en temps, un alien de la formation fonce vers le joueur --- */
  diveT-=dt;
  const f=al.filter(a=>a.s==='f'), nd=al.filter(a=>a.s==='d').length;   // aliens en formation / en plongeon
  if(st==='play'&&diveT<=0&&f.length&&nd<Math.min(2+(level>>1),6)){
    const a=f[Math.floor(Math.random()*f.length)];
    // x0,y0 = départ ; tx = cible (x du joueur au départ) ; amp = amplitude de la sinusoïde ; shots = tirs restants
    a.s='d';a.x0=a.x;a.y0=a.y;a.tx=pl.x;a.t=0;a.shots=1+(level>2?1:0);a.amp=rnd(40,90)*(Math.random()<.5?-1:1);
    diveT=Math.max(.5,1.7-level*.12)*rnd(.6,1.3);
  }

  /* --- Comportement de chaque alien selon son état --- */
  al.forEach(a=>{
    if(a.s==='f'){                                    // formation : suit sa case + balancement
      a.x=a.sx+ox;a.y=a.sy;
    }else if(a.s==='d'){                              // plongeon : descend en ondulant vers la cible
      a.t+=dt;a.y+=(130+level*14)*dt;
      const p=Math.min(1,(a.y-a.y0)/(H-a.y0));        // progression 0 → 1 du plongeon
      a.x=Math.max(16,Math.min(W-16,a.x0+(a.tx-a.x0)*p*.7+Math.sin(a.t*3.5)*a.amp*(1-p*.5)));
      if(a.shots>0&&a.y>140&&a.y<H-220&&Math.random()<dt*1.5){   // tire en cours de route, légèrement orienté vers le joueur
        a.shots--;eb.push({x:a.x,y:a.y+10,vx:Math.max(-60,Math.min(60,(pl.x-a.x)*.25)),vy:230+level*10});
      }
      if(a.y>H+30){a.s='r';a.y=-30}                   // sorti par le bas : repasse par le haut pour regagner sa case
    }else{                                            // 'r' : retour vers sa case (aussi utilisé à l’entrée de vague)
      const tx=a.sx+ox,ty=a.sy,dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy),v=240*dt;
      if(d<=v){a.s='f';a.x=tx;a.y=ty}else{a.x+=dx/d*v;a.y+=dy/d*v}
    }
  });

  /* --- Collisions : tirs joueur → aliens (1 tir détruit 1 alien) --- */
  pb.forEach(b=>{for(const a of al){
    if(!a.dead&&Math.abs(a.x-b.x)<14&&Math.abs(a.y-b.y)<13){
      a.dead=1;b.y=-99;
      score+=PTS[a.r]*(a.s==='d'?2:1);            // points doublés en plongeon
      boom(a.x,a.y,COL[a.r],14);drop(a.x,a.y,.16); // 16 % de chance de bonus
      break;
    }
  }});
  al=al.filter(a=>!a.dead);
  if(boss)bossStep(dt);                           // boss : déplacement, tirs, dégâts reçus

  /* --- Collisions : le joueur est touché (tir ennemi ou alien en plongeon) --- */
  if(pl.inv<=0&&st!=='over'){
    const rammed=a=>a.s==='d'&&Math.abs(a.x-pl.x)<20&&Math.abs(a.y-pl.y)<18;
    const hit=eb.some(b=>Math.abs(b.x-pl.x)<8+(b.r||4)&&Math.abs(b.y-pl.y)<10+(b.r||4))||al.some(rammed);
    if(hit){
      al.filter(rammed).forEach(a=>boom(a.x,a.y,COL[a.r],14));
      al=al.filter(a=>!rammed(a));                // l’alien qui percute meurt aussi
      boom(pl.x,pl.y,'#ffffff',26);eb=[];lives--;if(navigator.vibrate)navigator.vibrate(80);   // vibration au choc
     
      pw=Math.max(1,pw-1);dr=Math.max(0,dr-1);    // pénalité : −1 puissance, −1 drone
      if(lives<=0)endGame();else{pl.inv=2.2;pl.x=W/2}   // sinon respawn au centre, invincible 2,2 s
    }
  }

  /* --- Enchaînement des états : play → warn → boss → next → play --- */
  if(st==='play'&&!al.length){st='warn';msgT=2.4}                 // plus aucun alien : alerte
  if(st==='warn'){
    msgT-=dt;
    if(msgT<=0){                                                  // fin de l’alerte : le boss entre par le haut
      const hp=120+level*60, sh=80+level*30;                      // difficulté du boss selon le niveau
      boss={x:W/2,y:-80,t:0,hp,mhp:hp,sh,msh:sh,cd:1.2,n:0,fl:0};
      st='boss';
    }
  }
  if(st==='next'){
    msgT-=dt;
    if(msgT<=0){level++;pl.inv=2;wave();st='play'}                // niveau suivant (plus dur : voir formules dépendant de level)
  }
}

/* ================================================================
   7. RENDU (appelé à chaque image, après upd)
   ================================================================ */
/* Texte centré horizontalement (écrans titre, alerte, fin) */
function say(s,y,size,col){
  g.font=size+'px "Press Start 2P",ui-monospace,monospace';
  g.fillStyle=col;g.textAlign='center';g.fillText(s,W/2,y);
}

function draw(){
  /* Fond + étoiles */
  g.fillStyle='#070b1f';g.fillRect(0,0,W,H);
  stars.forEach(s=>{g.fillStyle='rgba(200,215,255,'+(.25+s.s*.35)+')';const z=s.s>1?2:1;g.fillRect(s.x,s.y,z,z)});

  /* Aliens (pose des pattes alternée 3 fois par seconde), bonus, boss */
  const legs=Math.floor(time*3)%2?L1:L2;
  al.forEach(a=>spr(body.concat(legs),a.x,a.y,2.4,COL[a.r]));
  gf.forEach(o=>{
    g.fillStyle=GC[o.k];g.fillRect(o.x-11,o.y-11,22,22);              // carré coloré
    g.fillStyle='#070b1f';g.font='12px "Press Start 2P",ui-monospace,monospace';
    g.textAlign='center';g.textBaseline='middle';g.fillText(o.k,o.x+1,o.y+1);   // lettre du bonus
  });
  if(boss)drawBoss();

  /* Joueur (clignote pendant l’invincibilité) et drones */
  if(st!=='title'&&st!=='over'){
    if(pl.inv<=0||Math.floor(time*12)%2){spr(SHIP,pl.x,pl.y,3,'#e8eeff');g.fillStyle='#ff6b57';g.fillRect(pl.x-3,pl.y-4,6,9)}
    for(let i=0;i<dr;i++)spr(SHIP,pl.x+(i?34:-34),pl.y+4,1.5,'#3ddbd9');
  }

  /* Tirs : joueur (jaune pâle), ennemis (rouge ; rond si r > 4 = tirs du boss) */
  g.fillStyle='#fff3b0';pb.forEach(b=>g.fillRect(b.x-1.5,b.y-8,3,14));
  g.fillStyle='#ff6b57';
  eb.forEach(b=>{const r=b.r||4;if(r>4){g.beginPath();g.arc(b.x,b.y,r,0,6.3);g.fill()}else g.fillRect(b.x-2,b.y-5,4,10)});

  /* Particules (s’estompent avec leur durée de vie) */
  pt.forEach(p=>{g.globalAlpha=Math.max(0,Math.min(1,p.l*2));g.fillStyle=p.c;g.fillRect(p.x,p.y,3,3)});
  g.globalAlpha=1;

  /* Interface : score, vague, vies, puissance et drones */
  g.textBaseline='top';
  if(st!=='title'){
    g.font='12px "Press Start 2P",ui-monospace,monospace';g.fillStyle='#dfe6ff';
    g.textAlign='left';g.fillText('Score '+score,14,14);
    g.textAlign='right';g.fillText('Vague '+level,W-14,14);
    for(let i=0;i<lives;i++)spr(SHIP,26+i*32,H-22,1.8,'#e8eeff');       // une icône de vaisseau par vie
    g.textAlign='right';g.fillText('Tir '+pw+(dr?' + '+dr+' drone'+(dr>1?'s':''):''),W-14,H-28);
  }

  /* Messages plein écran en cours de partie */
  g.textBaseline='alphabetic';
  if(st==='warn'){
    if(Math.floor(time*5)%2)say('Alerte',300,24,'#ff4d6d');
    say('Le boss approche',335,12,'#e8eeff');
  }else if(st==='next'){
    say('Boss vaincu',300,18,'#3ddbd9');
    say('Vague '+(level+1)+' plus difficile',335,11,'#e8eeff');
  }

  /* Menus : chaque btn() dessine un bouton ET l’enregistre dans btns pour la détection du toucher */
  btns=[];
  if(st==='title'){
    say('Galaxie',230,36,'#ffb02e');
    say('Meilleur score '+best,285,12,'#9fb0ff');
    btn(330,'Jouer',play);
    say('Glissez le doigt ou la souris',470,10,'#9fb0ff');
    say('Tir automatique',494,10,'#9fb0ff');
  }else if(st==='over'){
    say('Partie terminée',230,24,'#ff6b57');
    say('Score '+score,285,14,'#e8eeff');
    say('Meilleur score '+best,312,11,'#9fb0ff');
    btn(360,'Rejouer',play);btn(430,'Menu',menu);
  }else if(paused){
    g.fillStyle='rgba(3,5,26,.72)';g.fillRect(0,0,W,H);
    say('Pause',240,28,'#ffb02e');
    btn(290,'Reprendre',()=>{paused=false});btn(360,'Recommencer',play);btn(430,'Menu',menu);
  }else if(playing()){
    btns.push({x:W/2-36,y:0,w:72,h:42,fn:pause});                 // bouton pause (icône II) en haut au centre ; zone tactile agrandie pour les doigts
    g.fillStyle='#dfe6ff';g.fillRect(W/2-8,13,5,15);g.fillRect(W/2+3,13,5,15);
  }
}

/* ================================================================
   8. ENTRÉES : TOUCHER, MENUS, PAUSE (+ clavier pour tester sur ordinateur)
   - Le jeu ne démarre JAMAIS tout seul : il faut appuyer sur un bouton (Jouer, Rejouer, Reprendre).
   - Il ne se ferme jamais implicitement : application en arrière-plan, écran verrouillé
     ou bouton Retour d’Android = PAUSE, pas de sortie.
   - Déplacement : glisser le doigt n’importe où sur l’écran. Le mouvement est relatif
     (le vaisseau suit le doigt sans se placer dessous, donc on le voit toujours).
   ================================================================ */
const playing=()=>st==='play'||st==='warn'||st==='boss'||st==='next';
function pause(){if(playing())paused=true}
function play(){                                   // bouton Jouer / Rejouer / Recommencer
  paused=false;
  if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
  reset();
}
function menu(){paused=false;st='title';al=[];pb=[];eb=[];gf=[];boss=null}   // retour à l’accueil
function btn(y,label,fn){                           // dessine un bouton centré et l’enregistre
  const w=240,h=48,x=(W-w)/2;
  btns.push({x,y,w,h,fn});
  g.fillStyle='#1b2250';g.fillRect(x,y,w,h);
  g.strokeStyle='#ffb02e';g.lineWidth=2;g.strokeRect(x+1,y+1,w-2,h-2);
  say(label,y+30,14,'#e8eeff');
}

/* Position du doigt dans le repère du canvas (480 × 640) */
const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
let dragId=null,lastX=0;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const p=pos(e);
  if(!(st==='over'&&performance.now()-overAt<800)){          // 0,8 s de garde après la défaite : évite un « Rejouer » accidentel
    const b=btns.find(b=>p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h);
    if(b){b.fn();return}
  }
  if(playing()&&!paused){dragId=e.pointerId;lastX=e.clientX;cv.setPointerCapture(e.pointerId)}   // début du glissement
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==dragId)return;
  const r=cv.getBoundingClientRect();
  pl.x=Math.max(20,Math.min(W-20,pl.x+(e.clientX-lastX)*W/r.width*DRAG_SENS));   // déplacement du doigt (px écran) → px logiques, × sensibilité
  lastX=e.clientX;
});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,e=>{if(e.pointerId===dragId)dragId=null}));

cv.addEventListener('contextmenu',e=>e.preventDefault());   // pas de menu contextuel lors d’un appui long

/* Pause automatique (jamais de sortie implicite) */
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
addEventListener('blur',()=>{K={};pause()});
try{history.pushState({g:1},'');addEventListener('popstate',()=>{pause();history.pushState({g:1},'')})}catch(e){}   // bouton Retour d’Android = pause

/* Clavier (ordinateur) : flèches ou Q/D pour bouger, P ou Échap pour la pause */
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if([' ','arrowleft','arrowright'].includes(k))e.preventDefault();
  K[k]=1;
  if(k==='p'||k==='escape'){if(paused)paused=false;else pause()}
});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=0});

/* ================================================================
   9. BOUCLE PRINCIPALE
   ================================================================ */
let last=performance.now();
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000);   // plafonné : évite les « sauts » après un changement d’onglet
  last=ts;
  if(!paused)upd(dt);draw();   // en pause : la logique est figée, on redessine seulement
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
